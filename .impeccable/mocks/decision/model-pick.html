<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#E7EEF6;font-family:Archivo,sans-serif;color:#1A1C22;padding:16px 12px}
.form{background:#fff;border:2px solid #1A1C22;height:100%}
.hd{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:2px solid #1A1C22;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.tots{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid #1A1C22}
.tots div{padding:10px 12px}
.tots div+div{border-left:1px solid #1A1C22}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#5A5F6B}
.v{font-size:64px;font-weight:800;color:#2340A0;font-variant-numeric:tabular-nums;line-height:1}
.club{font-size:14px;font-weight:600}
.row{display:grid;grid-template-columns:36px 1fr 60px 1fr;border-bottom:1px solid #9AA3B2;min-height:64px}
.row>div{padding:8px;font-size:13px}
.row>div+div{border-left:1px solid #9AA3B2}
.n{font-weight:800;font-size:22px}
.sc{font-weight:800;font-size:22px;color:#2340A0;text-align:center}
.blank{background:repeating-linear-gradient(0deg,#fff 0 15px,#DCE3EE 15px 16px)}
.stamp{display:inline-block;border:2px solid #C8302C;color:#C8302C;font-weight:800;font-size:13px;padding:2px 6px;transform:rotate(-6deg);letter-spacing:.1em}
.sec{padding:8px 12px;font-size:22px;font-weight:800;text-transform:uppercase;border-bottom:2px solid #1A1C22;background:#F3F6FA}
</style></head><body><div class="form">
<div class="hd"><span>Club Duel — Score Sheet</span><span>Rd 2</span></div>
<div class="tots">
<div><div class="lbl">Club A</div><div class="club">Riverside PC</div><div class="v">112</div></div>
<div><div class="lbl">Club B</div><div class="club">Northgate PC</div><div class="v">104</div></div>
</div>
<div class="sec">Matches</div>
<div class="row"><div class="n">1</div><div>Ana Cruz<br>Ben Lim</div><div class="sc">11–7</div><div>Carl Uy<br>Dee Tan</div></div>
<div class="row"><div class="n">2</div><div>Eli Go<br>Fay Ong</div><div class="sc">9–11</div><div>Gus Sy<br>Hana Co</div></div>
<div class="row"><div class="n">3</div><div>Ivan Reyes<br>Joy Santos</div><div style="text-align:center"><span class="stamp">LIVE</span></div><div>Ken Dy<br>Lia Yu</div></div>
<div class="row"><div class="n">4</div><div class="blank"></div><div></div><div class="blank"></div></div>
<div class="row"><div class="n">5</div><div class="blank"></div><div></div><div class="blank"></div></div>
<div class="row"><div class="n">6</div><div class="blank"></div><div></div><div class="blank"></div></div>
<div class="row"><div class="n">7</div><div class="blank"></div><div></div><div class="blank"></div></div>
</div></body></html>
