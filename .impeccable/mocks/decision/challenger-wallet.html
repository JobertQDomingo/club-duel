<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#EEF1F7;font-family:Archivo,sans-serif;color:#1C2B5A}
.hd{background:#1C2B5A;color:#fff;padding:16px}
.k{font-family:'Archivo Narrow';font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.tots{display:flex;justify-content:space-between;margin-top:10px}
.t{font-size:13px;font-weight:600}
.v{font-size:68px;font-weight:800;line-height:.95;color:#fff;font-variant-numeric:tabular-nums}
.b .v{color:#FFB3AE}
.b{text-align:right}
.list{padding:12px}
.cp{background:#fff;margin-bottom:10px;display:grid;grid-template-columns:64px 1fr;border-left:6px solid #1C2B5A;position:relative}
.cp:after{content:"";position:absolute;left:64px;top:6px;bottom:6px;border-left:2px dashed #C6CCDA}
.no{padding:10px;font-family:'Archivo Narrow';font-weight:700;font-size:24px;color:#4B3A8C}
.body{padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.sc{font-size:24px;font-weight:800;color:#4B3A8C}
.st{border:2px solid #D0312D;color:#D0312D;font-family:'Archivo Narrow';font-weight:700;font-size:14px;padding:2px 8px;letter-spacing:.12em;transform:rotate(-4deg)}
.blank{color:#5F6884;font-family:'Archivo Narrow';letter-spacing:.2em;font-size:13px}
</style></head><body>
<div class="hd"><div class="k">Club Duel · Round 2 of open</div>

<div class="list">

<div class="cp"><div class="no">02</div><div class="body"><span>Eli Go · Fay Ong<br>Gus Sy · Hana Co</span><span class="sc">9–11</span></div></div>

<div class="cp"><div class="no">05</div><div class="body"><span class="blank">PAIRS SEALED</span></div></div>
<div class="cp"><div class="no">06</div><div class="body"><span class="blank">PAIRS SEALED</span></div></div>
<div class="cp"><div class="no">07</div><div class="body"><span class="blank">PAIRS SEALED</span></div></div>
</div></body></html>
