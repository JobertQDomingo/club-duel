<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#D6E4DA;font-family:Barlow,sans-serif;color:#16181D;padding:14px 10px}
.sheet{background:#fff;height:100%;padding:16px 14px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:baseline;font-family:'Barlow Semi Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.top b{font-size:22px;letter-spacing:0}
.band{display:grid;grid-template-columns:1fr 1fr;margin:12px -14px 0}
.band div{padding:10px 14px 12px;color:#fff}
.a{background:#1F5BD8}.b{background:#D7322B;text-align:right}
.club{font-family:'Barlow Semi Condensed';font-weight:700;font-size:14px;text-transform:uppercase}
.tot{font-family:'Barlow Semi Condensed';font-weight:800;font-size:76px;line-height:.9;font-variant-numeric:tabular-nums}
.race{position:relative;height:14px;margin:10px 0 4px;background:#EEF2EF}
.race i{position:absolute;top:0;bottom:0}
.race .ra{left:0;width:52%;background:#1F5BD8;opacity:.9}
.race .rb{right:0;width:48%;background:#D7322B;opacity:.9}
.race .mid{left:50%;width:2px;background:#16181D}
.lead{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
h2{font-family:'Barlow Semi Condensed';font-weight:700;font-size:24px;text-transform:uppercase;margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:12px;font-family:Barlow;font-weight:600;text-transform:none}
.row{display:grid;grid-template-columns:28px 1fr 46px 1fr;gap:6px;align-items:center;padding:8px 0;border-top:1px solid #16181D}
.n{font-family:'Barlow Semi Condensed';font-weight:800;font-size:22px}
.p{font-size:13px;line-height:1.25}
.p.r{text-align:right}
.sc{font-family:'Barlow Semi Condensed';font-weight:800;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.live{background:linear-gradient(transparent 55%,#F2DC4A 55%)}
.tape{height:30px;background:#E6D3A0;transform:rotate(-1.2deg);box-shadow:0 2px 4px rgba(0,0,0,.18);opacity:.95}
.tape.r{transform:rotate(1.4deg)}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;text-align:center}
</style></head><body><div class="sheet">
<div class="top"><span>Club Duel · Round 2</span><b>Live</b></div>
<div class="band">
<div class="a"><div class="club">Riverside PC</div><div class="tot">112</div></div>
<div class="b"><div class="club">Northgate PC</div><div class="tot">104</div></div>
</div>
<div class="race"><i class="ra"></i><i class="rb"></i><i class="mid"></i></div>
<div class="lead"><span>Riverside lead by 8</span><span>9 of 14 matches done</span></div>
<h2>Round 2 <span>Court status</span></h2>
<div class="row"><div class="n">1</div><div class="p">Ana Cruz<br>Ben Lim</div><div class="sc">11–7</div><div class="p r">Carl Uy<br>Dee Tan</div></div>
<div class="row"><div class="n">2</div><div class="p">Eli Go<br>Fay Ong</div><div class="sc">9–11</div><div class="p r">Gus Sy<br>Hana Co</div></div>
<div class="row live"><div class="n">3</div><div class="p">Ivan Reyes<br>Joy Santos</div><div><div class="tag">Court 2</div><div class="sc">LIVE</div></div><div class="p r">Ken Dy<br>Lia Yu</div></div>
<div class="row"><div class="n">4</div><div class="tape"></div><div class="tag">Pending</div><div class="tape r"></div></div>
<div class="row"><div class="n">5</div><div class="tape r"></div><div class="tag">Pending</div><div class="tape"></div></div>
<div class="row"><div class="n">6</div><div class="tape"></div><div class="tag">Pending</div><div class="tape r"></div></div>
</div></body></html>
